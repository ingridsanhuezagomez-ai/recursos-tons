<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quién Quiere Ser TONS? — Trauma Dentoalveolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A1628;
    --bg2: #0E1F3A;
    --panel: #10233F;
    --panel-line: #1D3A5F;
    --cyan: #6EE7F0;
    --cyan-dim: rgba(110,231,240,0.16);
    --amber: #FBBF24;
    --amber-dim: rgba(251,191,36,0.14);
    --green: #34D399;
    --green-dim: rgba(52,211,153,0.16);
    --red: #F87171;
    --red-dim: rgba(248,113,113,0.16);
    --text: #E8F1F5;
    --muted: #7C93AB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(110,231,240,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(251,191,36,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* --- topbar --- */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:14px 20px; border-bottom:1px solid var(--panel-line);
    background:rgba(10,22,40,0.6); backdrop-filter:blur(6px);
  }
  .topbar .cross{
    width:22px;height:22px; position:relative; flex-shrink:0;
  }
  .topbar .cross:before, .topbar .cross:after{
    content:""; position:absolute; background:var(--amber); border-radius:2px;
  }
  .topbar .cross:before{ width:22px; height:6px; top:8px; left:0;}
  .topbar .cross:after{ width:6px; height:22px; top:0; left:8px;}
  .topbar h1{font-size:16px; margin:0; letter-spacing:0.3px;}
  .topbar .sub{color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right;}

  /* --- ekg divider --- */
  .ekg-wrap{width:100%; height:26px; overflow:hidden; opacity:0.55;}
  .ekg-wrap svg{width:200%; height:100%; animation:ekgmove 3.2s linear infinite;}
  @keyframes ekgmove{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .ekg-wrap.fast svg{animation-duration:1s;}
  .ekg-wrap.fast path{stroke:var(--red);}

  main{flex:1; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px; width:100%;}
  .stage{width:100%; max-width:980px; margin:0 auto;}

  .card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .center{text-align:center;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:2px;
    font-size:11px; color:var(--cyan); margin-bottom:10px;
  }
  h2.display{font-size:24px; margin:0 0 6px; font-weight:600;}
  p.lead{color:var(--muted); font-size:14.5px; line-height:1.5; margin:0 0 20px;}

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px; cursor:pointer;
    border-radius:10px; border:1px solid var(--panel-line); background:var(--panel);
    color:var(--text); padding:14px 20px; transition:all .15s ease; width:100%;
  }
  .btn:hover{border-color:var(--cyan); background:var(--cyan-dim);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--panel-line); background:var(--panel);}
  .btn.primary{background:var(--cyan); color:#052A2E; border-color:var(--cyan);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.amber{background:var(--amber); color:#3A2600; border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.wide{width:auto; padding:14px 34px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px;}

  input.field, select.field{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--panel-line);
    background:#0B1C33; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:16px;
    letter-spacing:1px; outline:none; margin-bottom:12px; text-align:center;
  }
  input.field:focus, select.field:focus{border-color:var(--cyan);}
  label.flabel{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:1px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media(max-width:820px){.grid3{grid-template-columns:1fr;}}

  /* role picker */
  .role-card{cursor:pointer; text-align:left;}
  .role-card h3{margin:10px 0 4px; font-size:17px;}
  .role-card p{color:var(--muted); font-size:13px; margin:0;}
  .role-icon{font-size:26px;}

  /* team slots */
  .slot{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border:1px solid var(--panel-line); border-radius:10px; margin-bottom:10px; cursor:pointer;
  }
  .slot.taken{opacity:0.4; cursor:not-allowed;}
  .slot.selected{border-color:var(--cyan); background:var(--cyan-dim);}
  .slot .dot{width:10px;height:10px;border-radius:50%; margin-right:10px; flex-shrink:0;}

  /* lobby team chips */
  .chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; justify-content:center;}
  .chip{
    padding:10px 16px; border-radius:999px; border:1px solid var(--panel-line);
    font-size:13.5px; font-weight:600; background:#0B1C33;
  }
  .chip.on{border-color:var(--green); color:var(--green); background:var(--green-dim);}

  /* code display */
  .code-box{
    font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:600; letter-spacing:10px;
    background:#0B1C33; border:1px dashed var(--cyan); border-radius:12px; padding:20px;
    color:var(--cyan); margin:14px 0; text-align:center;
  }

  /* filmstrip ladder (host) */
  .layout{display:grid; grid-template-columns:190px 1fr; gap:18px;}
  @media(max-width:820px){.layout{grid-template-columns:1fr;}}
  .filmstrip{display:flex; flex-direction:column-reverse; gap:5px;}
  .frame{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 10px; border-radius:6px; border:1px solid var(--panel-line);
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);
  }
  .frame.current{border-color:var(--amber); background:var(--amber-dim); color:var(--amber); font-weight:600;}
  .frame.done{border-color:var(--green-dim); color:var(--green);}

  /* question header */
  .qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .points-badge{
    font-family:'IBM Plex Mono',monospace; background:var(--amber-dim); color:var(--amber);
    border:1px solid var(--amber); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600;
  }
  .timer{
    font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--cyan);
    border:1px solid var(--panel-line); border-radius:8px; padding:6px 14px;
  }
  .timer.low{color:var(--red); border-color:var(--red);}

  .qtext{font-size:19px; line-height:1.45; margin:6px 0 20px; font-weight:500;}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:600px){.options{grid-template-columns:1fr;}}
  .opt{
    display:flex; gap:10px; align-items:flex-start; text-align:left; padding:14px 16px;
    border-radius:10px; border:1px solid var(--panel-line); background:#0B1C33; cursor:pointer;
    font-size:14.5px; line-height:1.4; transition:all .12s ease;
  }
  .opt:hover{border-color:var(--cyan);}
  .opt.selected{border-color:var(--cyan); background:var(--cyan-dim);}
  .opt .letter{
    font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--cyan);
    border:1px solid var(--cyan); border-radius:6px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;
  }
  .opt.hidden-lifeline{display:none;}
  .opt.correct{border-color:var(--green); background:var(--green-dim);}
  .opt.correct .letter{border-color:var(--green); color:var(--green);}
  .opt.wrong{border-color:var(--red); background:var(--red-dim);}
  .opt.wrong .letter{border-color:var(--red); color:var(--red);}
  .opt.disabled{cursor:default;}

  .lifelines{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .life{
    flex:1; min-width:140px; padding:11px; border-radius:10px; border:1px solid var(--panel-line);
    background:#0B1C33; text-align:center; cursor:pointer; font-size:12.5px; font-weight:600;
  }
  .life .lemoji{font-size:18px; display:block; margin-bottom:4px;}
  .life:hover{border-color:var(--amber);}
  .life.used{opacity:0.3; cursor:not-allowed; text-decoration:line-through;}
  .life.used:hover{border-color:var(--panel-line);}

  .overlay-box{
    margin-top:14px; padding:14px 16px; border-radius:10px; border:1px solid var(--amber);
    background:var(--amber-dim); font-size:13.5px; line-height:1.5;
  }
  .overlay-box .otitle{font-weight:700; color:var(--amber); margin-bottom:4px; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;}

  .poll-bar-row{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px;}
  .poll-bar-row .plabel{width:22px; font-family:'IBM Plex Mono',monospace; color:var(--muted);}
  .poll-bar-track{flex:1; height:10px; background:#0B1C33; border-radius:6px; overflow:hidden;}
  .poll-bar-fill{height:100%; background:var(--cyan);}
  .poll-bar-pct{width:34px; text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--muted);}

  /* team monitor panel (host) */
  .monitor-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px;}
  @media(max-width:640px){.monitor-grid{grid-template-columns:1fr 1fr;}}
  .monitor{
    border:1px solid var(--panel-line); border-radius:10px; padding:12px; text-align:center;
    background:#0B1C33;
  }
  .monitor .tname{font-weight:700; font-size:13px; margin-bottom:4px;}
  .monitor .tstatus{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .monitor.answered{border-color:var(--green);}
  .monitor.answered .tstatus{color:var(--green);}
  .monitor .tscore{font-family:'IBM Plex Mono',monospace; font-size:17px; margin-top:6px; color:var(--cyan);}
  .life-dots{display:flex; gap:4px; justify-content:center; margin-top:6px;}
  .life-dots span{width:7px;height:7px;border-radius:50%; background:var(--panel-line);}
  .life-dots span.used{background:var(--red);}

  .explain-box{
    margin-top:16px; padding:14px 16px; border-radius:10px; border:1px solid var(--panel-line);
    background:rgba(110,231,240,0.05); font-size:13.5px; line-height:1.55; color:var(--text);
  }
  .explain-box b{color:var(--cyan);}

  .podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:26px 0 10px;}
  .pod-col{text-align:center; width:110px;}
  .pod-bar{border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:20px;}
  .pod-1 .pod-bar{height:150px; background:linear-gradient(180deg,var(--amber),#8A6100); color:#241800;}
  .pod-2 .pod-bar{height:110px; background:linear-gradient(180deg,#B9C4CF,#5C6B78); color:#0B1C33;}
  .pod-3 .pod-bar{height:80px; background:linear-gradient(180deg,#C98A5A,#6E4526); color:#241100;}
  .pod-4 .pod-bar{height:55px; background:#2A4166; color:#B9C9DA;}
  .pod-name{font-size:12.5px; font-weight:600; margin-top:8px;}
  .pod-pts{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .footer-note{color:var(--muted); font-size:12px; text-align:center; margin-top:18px;}
  .link-btn{background:none;border:none;color:var(--cyan); text-decoration:underline; cursor:pointer; font-size:13px; font-family:'Inter',sans-serif;}
  .waiting-pulse{
    display:inline-block; width:9px;height:9px;border-radius:50%; background:var(--amber);
    margin-right:8px; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  .error-text{color:var(--red); font-size:13px; margin-top:8px; text-align:center;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<script>
/* ======================= CONTENIDO CLÍNICO ======================= */
/* Fuente: MINSAL. Guía de Práctica Clínica para el manejo de urgencia de los
   Traumatismos Dentoalveolares (2023) — clasificación de Andreasen/OMS y
   recomendaciones GRADE. */

const QUESTION_SETS = {};
const SET_LABELS = {
  fracturas: "Parte 1 · Fracturas dentoalveolares",
  luxaciones: "Parte 2 · Luxaciones dentales",
  avulsiones: "Parte 3 · Avulsiones"
};
function qsFor(meta){
  const key = (meta && meta.setKey) || 'fracturas';
  return QUESTION_SETS[key] || QUESTION_SETS.fracturas;
}

QUESTION_SETS.fracturas = [
 {level:1, points:100, tipo:"Fractura coronaria no complicada",
  text:"¿Cuál es el hallazgo clínico de una fractura coronaria NO complicada?",
  options:["Esmalte y dentina comprometidos, con pulpa no expuesta","Esmalte y dentina comprometidos, con pulpa expuesta","Fragmento coronario móvil","Movilidad del segmento óseo"],
  correct:0,
  hint:"Piensa en qué tejido NO debe estar afectado para que la fractura sea 'no complicada'.",
  explain:"En la fractura coronaria no complicada el hallazgo clínico es esmalte y dentina comprometidos, con la pulpa no expuesta."},
 {level:2, points:150, tipo:"Fractura coronaria no complicada",
  text:"El tratamiento de una fractura coronaria NO complicada, tanto en dentición primaria como permanente, consiste en:",
  options:["Suavizar los ángulos y restaurar con vidrio ionómero o resina","Pulpotomía inmediata","Exodoncia del diente afectado","Ferulización por 4 semanas"],
  correct:0,
  hint:"Es un manejo simple y conservador, igual en ambas denticiones.",
  explain:"El tratamiento en ambas denticiones es suavizar los ángulos filosos y restaurar con vidrio ionómero (VI) o resina."},
 {level:3, points:200, tipo:"Fractura coronaria complicada",
  text:"En dentición PRIMARIA con raíz completa, ante una fractura coronaria COMPLICADA (pulpa expuesta), las opciones de tratamiento incluyen:",
  options:["Pulpotomía, pulpectomía o extracción","Solo observación, sin ningún tratamiento","Reposicionar y ferulizar por 4 semanas","Suavizar ángulos y restaurar con resina, sin más manejo"],
  correct:0,
  hint:"Piensa en las alternativas endodónticas o de extracción para un diente temporal con la pulpa expuesta.",
  explain:"En diente primario con raíz completa y fractura coronaria complicada, las opciones son pulpotomía, pulpectomía o extracción, según el caso."},
 {level:4, points:250, tipo:"Fractura coronaria complicada",
  text:"En dentición PERMANENTE, con raíz completa, el tratamiento de una fractura coronaria COMPLICADA es:",
  options:["Endodoncia","Recubrimiento pulpar directo únicamente","Extracción del diente","Solo control radiográfico"],
  correct:0,
  hint:"En raíces inmaduras se prioriza preservar la vitalidad; con raíz completa cambia la conducta.",
  explain:"En diente permanente con raíz completa, la fractura coronaria complicada se trata con endodoncia; en raíces inmaduras se prioriza recubrimiento pulpar o pulpotomía para preservar la vitalidad."},
 {level:5, points:300, tipo:"Fractura corono-radicular",
  text:"El hallazgo clínico característico de una fractura CORONO-RADICULAR es:",
  options:["Afecta la raíz, con segmentos móviles","Pulpa expuesta, sin compromiso radicular","Esmalte y dentina, pulpa no expuesta","Fragmento coronario móvil únicamente"],
  correct:0,
  hint:"El nombre indica que compromete tanto la corona como la raíz.",
  explain:"La fractura corono-radicular afecta la raíz y genera segmentos móviles del diente."},
 {level:6, points:350, tipo:"Fractura corono-radicular",
  text:"En dentición PRIMARIA, el tratamiento de una fractura corono-radicular es:",
  options:["Exodoncia","Endodoncia y control","Recubrimiento pulpar únicamente","Reposicionar y ferulizar por 4 semanas"],
  correct:0,
  hint:"Es un manejo definitivo, no conservador, en el diente temporal.",
  explain:"En dentición primaria, la fractura corono-radicular se trata con exodoncia."},
 {level:7, points:400, tipo:"Fractura radicular",
  text:"En dentición PRIMARIA, ante una fractura radicular con fragmento coronario móvil, el tratamiento consiste en:",
  options:["Extraer la porción del diente desplazado","Reposicionar y ferulizar por 4 semanas","Endodoncia inmediata","Observación sin tratamiento"],
  correct:0,
  hint:"El hallazgo clínico es un fragmento coronario móvil; piensa en el manejo más simple para el diente temporal.",
  explain:"El hallazgo clínico de la fractura radicular es un fragmento coronario móvil; en dentición primaria se extrae la porción desplazada del diente."},
 {level:8, points:450, tipo:"Fractura radicular",
  text:"En dentición PERMANENTE, el manejo de una fractura radicular incluye reposicionar, ferulizar por 4 semanas y controlar con radiografía; si aparece necrosis, se debe realizar:",
  options:["Endodoncia hasta la línea de fractura","Exodoncia inmediata del diente completo","Extracción solo del fragmento apical","Ninguna intervención adicional"],
  correct:0,
  hint:"No se trata todo el conducto, solo hasta un punto específico.",
  explain:"Si el control radiográfico muestra necrosis, se realiza endodoncia hasta la línea de fractura, en dentición permanente."},
 {level:9, points:500, tipo:"Fractura alveolar",
  text:"El hallazgo clínico de una fractura ALVEOLAR y su tratamiento (igual en ambas denticiones) es:",
  options:["Movilidad del segmento óseo; reposicionar y ferulizar por 4 semanas","Fragmento coronario móvil; extraer la porción desplazada","Pulpa expuesta; pulpotomía","Esmalte y dentina comprometidos; restauración con resina"],
  correct:0,
  hint:"Piensa en un bloque óseo que se mueve, no en un solo diente.",
  explain:"En la fractura alveolar el hallazgo clínico es la movilidad del segmento óseo, y el tratamiento —igual en dentición primaria y permanente— es reposicionar y ferulizar por 4 semanas."},
 {level:10, points:600, tipo:"Fracturas · Indicaciones al paciente",
  text:"PREGUNTA TONS — Según las indicaciones al paciente tras un trauma dentoalveolar por fractura, ¿cuál de las siguientes es correcta?",
  options:["Aplicar clorhexidina tópica al 0,1% con un cotonito 2 veces al día durante 1 semana, y dieta blanda por 10 a 14 días","Aplicar clorhexidina al 2% en spray, 4 veces al día por 1 mes","Dieta líquida estricta por 4 semanas, sin excepciones","No se requiere ninguna indicación de higiene oral"],
  correct:0,
  hint:"Recuerda la concentración, la forma de aplicación y la duración exactas.",
  explain:"Las indicaciones incluyen cepillado suave después de cada comida, clorhexidina tópica al 0,1% con cotonito 2 veces al día por 1 semana, dieta blanda por 10 a 14 días, y bálsamo labial si hay lesiones labiales asociadas."}
];

QUESTION_SETS.luxaciones = [
 {level:1, points:100, tipo:"Concusión",
  text:"¿Cuáles son las características clínicas de la CONCUSIÓN?",
  options:["Diente sensible al tacto o percusión, sin movilidad aumentada ni desplazamiento","Movilidad aumentada, sin desplazamiento, con hemorragia en el surco gingival","Diente desplazado hacia palatino, con sonido metálico a la percusión","Diente con apariencia elongada y movilidad excesiva"],
  correct:0,
  hint:"Es la lesión periodontal más leve del espectro de luxaciones.",
  explain:"La concusión se caracteriza por un diente sensible al tacto o percusión, sin movilidad aumentada ni desplazamiento; en dientes permanentes, el test de sensibilidad suele ser positivo."},
 {level:2, points:150, tipo:"Concusión",
  text:"El manejo de la concusión, tanto en dentición primaria como permanente, es:",
  options:["No necesita tratamiento; observación","Férula flexible por 2 semanas","Exodoncia preventiva","Reposicionar bajo anestesia"],
  correct:0,
  hint:"Es igual en ambas denticiones, y es el manejo más simple de todos.",
  explain:"En ambas denticiones, la concusión no necesita tratamiento activo: solo observación."},
 {level:3, points:200, tipo:"Subluxación",
  text:"La subluxación se caracteriza clínicamente por movilidad aumentada y sensibilidad al tacto o percusión sin desplazamiento, pudiendo presentar hemorragia en el surco gingival. Radiográficamente se observa:",
  options:["Generalmente sin anomalías, con espacio periodontal normal","Espacio periodontal ausente","Espacio periodontal ensanchado, visible en oclusales","Espacio periodontal aumentado solo en la zona apical"],
  correct:0,
  hint:"Al no haber desplazamiento del diente, ¿qué cambios radiográficos esperarías?",
  explain:"Radiográficamente, la subluxación suele mostrarse sin anomalías visibles, con espacio periodontal normal."},
 {level:4, points:250, tipo:"Subluxación",
  text:"El tratamiento de la subluxación difiere según la dentición: en PRIMARIA no necesita tratamiento (observación), mientras que en PERMANENTE se indica:",
  options:["Férula flexible por 2 semanas","Férula rígida por 4 semanas","Exodoncia","Endodoncia inmediata"],
  correct:0,
  hint:"Es una férula breve, no rígida ni prolongada.",
  explain:"En dentición permanente, la subluxación se trata con férula flexible por 2 semanas; en dentición primaria solo se observa."},

const FIREBASE_URL = "https://quien-quiere-ser-tons-default-rtdb.firebaseio.com";

function esc(str){
  if(str===undefined || str===null) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fbPath(key){
  return "/" + key.split(':').join('/') + ".json";
}
async function sGet(key){
  try{
    const res = await fetch(FIREBASE_URL + fbPath(key));
    if(!res.ok) return null;
    const data = await res.json();
    return data === null ? null : data;
  } catch(e){ return null; }
}
async function sSet(key, val){
  try{
    const res = await fetch(FIREBASE_URL + fbPath(key), {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
    return res.ok;
  } catch(e){ return false; }
}
function genCode(){
  const w = CODEWORDS[Math.floor(Math.random()*CODEWORDS.length)];
  const n = String(Math.floor(Math.random()*90)+10);
  return w+n;
}

async function createGame(setKey){
  const c = genCode();
  const m = {status:'lobby', qIndex:-1, questionStartedAt:null, setKey: setKey};
  const sc = {1:0,2:0,3:0,4:0};
  await sSet('game:'+c+':meta', m);
  await sSet('game:'+c+':scores', sc);
  S.code = c; S.hostMeta = m; S.hostScores = sc;
  startHostPolling();
  render();
}

function startHostPolling(){
  clearPoll();
  async function poll(){
    const m = await sGet('game:'+S.code+':meta');
    const sc = await sGet('game:'+S.code+':scores');
    const t = {};
    for(let i=1;i<=4;i++){ t[i] = await sGet('game:'+S.code+':team'+i); }
    if(m) S.hostMeta = m;
    if(sc) S.hostScores = sc;
    S.hostTeams = t;
    render();
  }
  poll();
  S.pollId = setInterval(poll, POLL_MS);
}

async function startGame(){
  const m = {status:'playing', qIndex:0, questionStartedAt: Date.now()};
  await sSet('game:'+S.code+':meta', m);
  S.hostMeta = m; render();
}

async function revealNow(){
  const meta = S.hostMeta;
  const q = qsFor(meta)[meta.qIndex];
  const newScores = {...S.hostScores};
  const awarded = {};
  for(let i=1;i<=4;i++){
    const team = S.hostTeams[i];
    if(team && team.answers && team.answers[meta.qIndex] !== undefined){
      const ansIdx = LETTERS.indexOf(team.answers[meta.qIndex]);
      if(ansIdx === q.correct){
        const answerTime = team.answerTimes && team.answerTimes[meta.qIndex];
        let ratio = 0;
        if(typeof answerTime === 'number' && meta.questionStartedAt){
          const elapsed = answerTime - meta.questionStartedAt;
          ratio = Math.min(1, Math.max(0, elapsed / (TIME_LIMIT*1000)));
        }
        // 100% de los puntos si responde de inmediato, bajando hasta 50% si responde justo al límite de tiempo
        const pts = Math.round(q.points * (0.5 + 0.5*(1-ratio)));
        awarded[i] = pts;
        newScores[i] = (newScores[i]||0) + pts;
      }
    }
  }
  await sSet('game:'+S.code+':scores', newScores);
  S.hostScores = newScores;
  const m = {...meta, status:'reveal', awarded: awarded};
  await sSet('game:'+S.code+':meta', m);
  S.hostMeta = m; render();
}

async function nextQuestion(){
  const nextIdx = S.hostMeta.qIndex + 1;
  let m;
  if(nextIdx >= qsFor(S.hostMeta).length){ m = {...S.hostMeta, status:'finished'}; }
  else{ m = {status:'playing', qIndex: nextIdx, questionStartedAt: Date.now(), setKey: S.hostMeta.setKey}; }
  await sSet('game:'+S.code+':meta', m);
  S.hostMeta = m; render();
}

  q.options.forEach((opt,idx)=>{
    let cls = "opt disabled";
    if(meta.status==='reveal' && idx===q.correct) cls += " correct";
    optionsHtml += '<div class="'+cls+'"><div class="letter">'+LETTERS[idx]+'</div><div>'+esc(opt)+'</div></div>';
  });

  let explainHtml = "";
  if(meta.status==='reveal'){
    explainHtml = '<div class="explain-box"><b>Fundamento clínico:</b> '+q.explain+'</div>';
  }

  let monitors = "";
  for(let i=1;i<=4;i++){
    const team = S.hostTeams[i];
    const has = team && team.answers && team.answers[meta.qIndex] !== undefined;
    let statusTxt = "Sin conectar", cls = "monitor", borderStyle = "";
    if(team && team.joined){
      statusTxt = has ? "Respondió ✓" : "Pensando…";
      if(has) cls += " answered";
      borderStyle = 'style="border-color:'+TEAM_COLORS[i]+'"';
    }
    let resultTxt = "";
    if(meta.status==='reveal' && has){
      const correct = LETTERS.indexOf(team.answers[meta.qIndex]) === q.correct;
      const pts = (meta.awarded && meta.awarded[i] !== undefined) ? meta.awarded[i] : q.points;
      resultTxt = correct ? '<div class="tstatus" style="color:var(--green);margin-top:2px">✓ Correcto +'+pts+'</div>' : '<div class="tstatus" style="color:var(--red);margin-top:2px">✗ Incorrecto</div>';
    }
    let dots = "";
    if(team && team.lifelinesUsed){
      dots = '<div class="life-dots"><span class="'+(team.lifelinesUsed.fifty?'used':'')+'"></span><span class="'+(team.lifelinesUsed.publicHelp?'used':'')+'"></span><span class="'+(team.lifelinesUsed.call?'used':'')+'"></span></div>';
    }
    monitors += '<div class="'+cls+'" '+borderStyle+'>'+
      '<div class="tname" style="color:'+TEAM_COLORS[i]+'">'+esc(team&&team.name ? team.name : "Grupo "+i)+'</div>'+
      '<div class="tstatus">'+statusTxt+'</div>'+resultTxt+
      '<div class="tscore">'+((S.hostScores&&S.hostScores[i])||0)+'</div>'+dots+
    '</div>';
  }

  let actionBtn = "";
  if(meta.status==='playing'){
    actionBtn = '<button class="btn amber wide" onclick="revealNow()">Cerrar respuestas y revelar ('+answeredCount+'/4 respondieron)</button>';
  } else {
    actionBtn = '<button class="btn primary wide" onclick="nextQuestion()">'+(meta.qIndex+1 >= QS.length ? "Ver resultados finales" : "Siguiente pregunta →")+'</button>';
  }

  const timerHtml = meta.status==='playing'
    ? '<div class="timer'+(remaining<=10?' low':'')+'">'+remaining+'s</div>'
    : '<div class="timer">Revelado</div>';

  return topBarHtml("Sala "+S.code+" · "+(SET_LABELS[meta.setKey]||"")+" · Pregunta "+(meta.qIndex+1)+" de "+QS.length) + ekgHtml(meta.status==='playing' && remaining<=10) +
  '<main><div class="stage"><div class="layout">'+
    '<div><div class="eyebrow">Nivel</div><div class="filmstrip">'+filmstrip+'</div></div>'+
    '<div><div class="card">'+
      '<div class="qmeta"><div class="points-badge">hasta '+q.points+' pts</div>'+timerHtml+'</div>'+
      '<div class="eyebrow" style="margin-bottom:2px">'+esc(q.tipo)+'</div>'+
      '<div class="qtext display">'+esc(q.text)+'</div>'+
      '<div class="options">'+optionsHtml+'</div>'+
      explainHtml+
      '<div class="monitor-grid">'+monitors+'</div>'+
      '<div class="btn-row" style="margin-top:20px">'+actionBtn+'</div>'+
    '</div></div>'+
  '</div></div></main>';
}

/* ======================= FLUJO GRUPO ======================= */
async function checkCode(){
  S.error = "";
  const codeVal = (S.inputCode||"").toUpperCase().trim();
  const m = await sGet('game:'+codeVal+':meta');
  if(!m){ S.error = "No se encontró una partida con ese código."; render(); return; }
  const t = {};
  for(let i=1;i<=4;i++){ t[i] = await sGet('game:'+codeVal+':team'+i); }
  S.takenSlots = t;
  S.joinedCode = codeVal;
  render();
}

async function joinTeam(id){
  if(!(S.teamNameInput||"").trim()){ S.error = "Escribe un nombre para tu grupo."; render(); return; }
  const team = {name: S.teamNameInput.trim(), joined:true, lifelinesUsed:{fifty:false, publicHelp:false, call:false}, answers:{}};
  await sSet('game:'+S.joinedCode+':team'+id, team);
  S.teamId = id; S.myTeam = team;
  startTeamPolling();
  render();
}

function startTeamPolling(){
  clearPoll();
  async function poll(){
    const m = await sGet('game:'+S.joinedCode+':meta');
    const sc = await sGet('game:'+S.joinedCode+':scores');
    const mt = await sGet('game:'+S.joinedCode+':team'+S.teamId);
    const others = {};
    for(let i=1;i<=4;i++){ others[i] = await sGet('game:'+S.joinedCode+':team'+i); }
    if(m){
      const qKey = m.qIndex+':'+m.status;
      if(S.lastQKey !== qKey){
        S.selectedOpt = null; S.hiddenOpts = []; S.pollShown = false; S.hintShown = false; S.pollVals = null;
        S.lastQKey = qKey;
      }
      S.meta = m;
    }
    if(sc) S.scores = sc;
    if(mt) S.myTeam = mt;
    S.teams = others;
    render();
  }
  poll();
  S.pollId = setInterval(poll, POLL_MS);
}

async function submitAnswer(idx){
  S.selectedOpt = idx;
  const updated = {...S.myTeam,
    answers:{...(S.myTeam.answers||{}), [S.meta.qIndex]: LETTERS[idx]},
    answerTimes:{...(S.myTeam.answerTimes||{}), [S.meta.qIndex]: {".sv":"timestamp"}}
  };
  await sSet('game:'+S.joinedCode+':team'+S.teamId, updated);
  S.myTeam = updated;
  render();
}

async function useLifeline(type){
  if(S.myTeam.lifelinesUsed[type]) return;
  const q = qsFor(S.meta)[S.meta.qIndex];
  if(type === 'fifty'){
    const wrongIdxs = [0,1,2,3].filter(i=>i!==q.correct);
    const shuffled = wrongIdxs.sort(()=>Math.random()-0.5);
    S.hiddenOpts = shuffled.slice(0,2);
  } else if(type === 'publicHelp'){
    S.pollShown = true;
    S.pollVals = computePoll(q.correct);
  } else if(type === 'call'){
    S.hintShown = true;
  }
  const updated = {...S.myTeam, lifelinesUsed:{...S.myTeam.lifelinesUsed, [type]:true}};
  await sSet('game:'+S.joinedCode+':team'+S.teamId, updated);
  S.myTeam = updated;
  render();
}

function computePoll(correctIdx){
  let vals = [0,0,0,0];
  let remaining = 100;
  vals[correctIdx] = 42 + Math.floor(Math.random()*20);
  remaining -= vals[correctIdx];
  const others = [0,1,2,3].filter(i=>i!==correctIdx);
  others.forEach((idx,k)=>{
    if(k === others.length-1){ vals[idx] = remaining; }
    else{ const v = Math.floor(Math.random()*Math.max(1,(remaining-(others.length-1-k)))); vals[idx]=v; remaining-=v; }
  });
  return vals;
}

function renderTeam(){
  if(!S.joinedCode){
    return topBarHtml("Ingreso de grupo") + ekgHtml(false) +
    '<main><div class="stage" style="max-width:440px"><div class="card center">'+
      '<div class="eyebrow">Unirse a una partida</div><h2 class="display">Código de la sala</h2>'+
      '<input class="field" placeholder="EJ: FRAC07" data-bind="inputCode" data-enter="checkCode" value="'+esc(S.inputCode)+'">'+
      '<button class="btn primary wide" onclick="checkCode()">Continuar</button>'+
      (S.error? '<div class="error-text">'+esc(S.error)+'</div>':'')+
      '<div style="margin-top:14px"><button class="link-btn" onclick="goHome()">← volver</button></div>'+
    '</div></div></main>';
  }
  if(!S.teamId){
    let slots = "";
    for(let i=1;i<=4;i++){
      const t = S.takenSlots[i];
      const taken = t && t.joined;
      slots += '<div class="slot'+(taken?' taken':'')+'" onclick="'+(taken?'':'joinTeam('+i+')')+'">'+
        '<div style="display:flex;align-items:center"><div class="dot" style="background:'+TEAM_COLORS[i]+'"></div><span>Grupo '+i+'</span></div>'+
        '<span style="color:var(--muted);font-size:12.5px">'+(taken? esc(t.name)+' ✓' : 'disponible')+'</span>'+
      '</div>';
    }
    return topBarHtml("Sala "+S.joinedCode) + ekgHtml(false) +
    '<main><div class="stage" style="max-width:440px"><div class="card">'+
      '<div class="eyebrow center">Elige tu grupo</div>'+
      '<label class="flabel">Nombre del grupo</label>'+
      '<input class="field" placeholder="Ej: Los Ápices" data-bind="teamNameInput" value="'+esc(S.teamNameInput)+'">'+
      slots+
      (S.error? '<div class="error-text">'+esc(S.error)+'</div>':'')+
    '</div></div></main>';
  }
  if(!S.meta) return screenLoading();
  if(S.meta.status === 'lobby'){
    return topBarHtml("Grupo "+S.teamId+" · "+esc(S.myTeam&&S.myTeam.name)) + ekgHtml(false) +
    '<main><div class="stage" style="max-width:440px"><div class="card center">'+
      '<div class="waiting-pulse"></div>'+
      '<p class="lead" style="margin-top:10px">Conectado como <b style="color:'+TEAM_COLORS[S.teamId]+'">'+esc(S.myTeam&&S.myTeam.name)+'</b>. Esperando a que el docente inicie la partida…</p>'+
    '</div></div></main>';
  }
  if(S.meta.status === 'finished'){
    return finishedHtml(S.teams, S.scores, false, S.teamId);
  }
  return teamQuestionHtml();
}

function teamQuestionHtml(){
  const meta = S.meta, QS = qsFor(meta), q = QS[meta.qIndex];
  const hasAnswered = S.myTeam && S.myTeam.answers && S.myTeam.answers[meta.qIndex] !== undefined;
  const myAnsIdx = hasAnswered ? LETTERS.indexOf(S.myTeam.answers[meta.qIndex]) : null;
  const locked = meta.status === 'reveal';
  let remaining = TIME_LIMIT;
  if(meta.status==='playing'){ remaining = Math.max(0, TIME_LIMIT - Math.floor((Date.now()-meta.questionStartedAt)/1000)); }

  let optionsHtml = "";
  q.options.forEach((opt,idx)=>{
    if(S.hiddenOpts.includes(idx) && !locked){ optionsHtml += '<div class="opt hidden-lifeline"></div>'; return; }
    let cls = "opt";
    if(locked){
      cls += " disabled";
      if(idx===q.correct) cls += " correct";
      else if(idx===myAnsIdx) cls += " wrong";
    } else if(idx===S.selectedOpt || idx===myAnsIdx){ cls += " selected"; }
    optionsHtml += '<div class="'+cls+'" onclick="'+(locked?'':'submitAnswer('+idx+')')+'"><div class="letter">'+LETTERS[idx]+'</div><div>'+esc(opt)+'</div></div>';
  });

  let lifelinesHtml = "";
  if(!locked){
    lifelinesHtml = '<div class="lifelines">'+
      '<div class="life'+(S.myTeam.lifelinesUsed.fifty?' used':'')+'" onclick="useLifeline(\'fifty\')"><span class="lemoji">✂️</span>50 / 50</div>'+
      '<div class="life'+(S.myTeam.lifelinesUsed.publicHelp?' used':'')+'" onclick="useLifeline(\'publicHelp\')"><span class="lemoji">📊</span>Consulta a la clínica</div>'+
      '<div class="life'+(S.myTeam.lifelinesUsed.call?' used':'')+'" onclick="useLifeline(\'call\')"><span class="lemoji">📞</span>Interconsulta</div>'+
    '</div>';
  }

  let pollHtml = "";
  if(S.pollShown && !locked && S.pollVals){
    let bars = "";
    q.options.forEach((o,idx)=>{
      bars += '<div class="poll-bar-row"><div class="plabel">'+LETTERS[idx]+'</div><div class="poll-bar-track"><div class="poll-bar-fill" style="width:'+S.pollVals[idx]+'%"></div></div><div class="poll-bar-pct">'+S.pollVals[idx]+'%</div></div>';
    });
    pollHtml = '<div class="overlay-box"><div class="otitle">Resultado de la consulta a la clínica</div>'+bars+'</div>';
  }

  let hintHtml = "";
  if(S.hintShown && !locked){
    hintHtml = '<div class="overlay-box"><div class="otitle">Interconsulta con el experto</div>'+esc(q.hint)+'</div>';
  }

  let waitingHtml = "";
  if(hasAnswered && !locked){
    waitingHtml = '<p class="footer-note"><span class="waiting-pulse"></span>Respuesta enviada. Puedes cambiarla hasta que el docente cierre la pregunta.</p>';
  }

  let explainHtml = "";
  if(locked){
    const myCorrect = myAnsIdx === q.correct;
    const myPts = (meta.awarded && meta.awarded[S.teamId] !== undefined) ? meta.awarded[S.teamId] : null;
    let resultLine = "";
    if(myCorrect && myPts !== null){
      resultLine = '<p class="footer-note" style="color:var(--green);font-weight:700;margin-bottom:10px">✓ Correcto — ganaste '+myPts+' pts (mientras más rápido respondas, más puntos ganas)</p>';
    } else if(hasAnswered && !myCorrect){
      resultLine = '<p class="footer-note" style="color:var(--red);font-weight:700;margin-bottom:10px">✗ Incorrecto — 0 pts esta ronda</p>';
    }
    explainHtml = resultLine + '<div class="explain-box"><b>Fundamento clínico:</b> '+q.explain+'</div>';
  }

  const timerHtml = meta.status==='playing' ? '<div class="timer'+(remaining<=10?' low':'')+'">'+remaining+'s</div>' : '';
  const myScore = (S.scores && S.scores[S.teamId]) || 0;

  return topBarHtml("Grupo "+S.teamId+" · "+esc(S.myTeam&&S.myTeam.name)+" · "+myScore+" pts") + ekgHtml(meta.status==='playing' && remaining<=10) +
  '<main><div class="stage" style="max-width:640px"><div class="card">'+
    '<div class="qmeta"><div class="points-badge">Pregunta '+(meta.qIndex+1)+'/'+QS.length+' · hasta '+q.points+' pts</div>'+timerHtml+'</div>'+
    (meta.status==='playing' ? '<p class="footer-note" style="margin:-4px 0 8px;text-align:left">⚡ Mientras más rápido respondas correcto, más puntos ganas</p>' : '')+
    '<div class="eyebrow" style="margin-bottom:2px">'+esc(q.tipo)+'</div>'+
    '<div class="qtext display">'+esc(q.text)+'</div>'+
    '<div class="options">'+optionsHtml+'</div>'+
    lifelinesHtml + pollHtml + hintHtml + waitingHtml + explainHtml+
  '</div></div></main>';
}

/* ======================= COMUNES ======================= */
function screenLoading(){
  return topBarHtml("") + ekgHtml(false) + '<main><div class="stage center" style="max-width:400px"><p class="lead">Cargando…</p></div></main>';
}

function finishedHtml(teams, scores, isHost, myId){
  const ranking = [1,2,3,4]
    .map(i => ({id:i, name: teams[i]&&teams[i].name ? teams[i].name : "Grupo "+i, joined: teams[i]&&teams[i].joined, score: scores? (scores[i]||0) : 0}))
    .filter(t=>t.joined)
    .sort((a,b)=>b.score-a.score);
  const order = [1,0,2,3];
  const podClasses = ["pod-2","pod-1","pod-3","pod-4"];
  let podium = "";
  order.forEach((rankIdx,i)=>{
    const t = ranking[rankIdx];
    if(!t){ podium += '<div class="pod-col"></div>'; return; }
    podium += '<div class="pod-col '+podClasses[i]+'"><div class="pod-bar">'+(rankIdx+1)+'</div>'+
      '<div class="pod-name" style="color:'+TEAM_COLORS[t.id]+'">'+esc(t.name)+(isHost===false && t.id===myId ? ' (tú)':'')+'</div>'+
      '<div class="pod-pts">'+t.score+' pts</div></div>';
  });
  return topBarHtml("Resultados finales") + ekgHtml(false) +
  '<main><div class="stage" style="max-width:640px"><div class="card center">'+
    '<div class="eyebrow">Trauma dentoalveolar · Fracturas</div><h2 class="display">¡Partida terminada!</h2>'+
    '<div class="podium">'+podium+'</div>'+
    '<div class="footer-note" style="margin-top:20px">Revisen en conjunto las respuestas y el fundamento clínico de cada pregunta antes de continuar con el siguiente tema.</div>'+
    '<div style="margin-top:16px"><button class="link-btn" onclick="goHome()">← salir de la partida</button></div>'+
  '</div></div></main>';
}

/* ======================= AUTO-INGRESO DESDE QR ======================= */
(function initFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get('code');
  const roleParam = params.get('role');
  if(codeParam && roleParam === 'team'){
    S.role = 'team';
    S.inputCode = codeParam.toUpperCase().trim();
  }
})();

render();
if(S.role === 'team' && S.inputCode && !S.joinedCode){
  checkCode();
}
</script>
